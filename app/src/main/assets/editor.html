<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #191A1C;
            color: #BCBEC4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        #editor {
            height: 100%;
            width: 100%;
        }
        .monaco-editor {
            background: #191A1C !important;
        }
        .monaco-editor .margin {
            background: #191A1C !important;
        }
        .monaco-editor .lines-content {
            background: #191A1C !important;
        }
    </style>
</head>
<body>
    <div id="editor"></div>

    <!-- Monaco Editor AMD Loader -->
    <script src="editor/vs/loader.js"></script>
    <script>
        require.config({
            paths: {
                'vs': 'file:///android_asset/editor/vs'
            }
        });

        let editor = null;
        let currentFile = '';
        let currentContent = '';
        let debounceTimer = null;
        let completionProvider = null;

        // Initialize editor
        require(['vs/editor/editor.main'], function() {
            // Define Java language
            monaco.languages.register({ id: 'java' });
            monaco.languages.setMonarchTokensProvider('java', {
                tokenizer: {
                    root: [
                        [/\/\/.*$/, 'comment'],
                        [/\/\*/, 'comment', '@comment'],
                        [/"([^"\\]|\\.)*$/, 'string.invalid'],
                        [/"/, 'string', '@string'],
                        [/'[^\\']'/, 'string'],
                        [/(\\d+\.\d+|\d+)(f|F|d|D|l|L)?/, 'number'],
                        [/0x[0-9a-fA-F]+(l|L)?/, 'number.hex'],
                        [/\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|record|sealed|permits|yield|var|module|exports|opens|requires|uses|provides|with|non-sealed)\b/, 'keyword'],
                        [/\b(true|false|null)\b/, 'keyword'],
                        [/@[a-zA-Z_][a-zA-Z0-9_]*/, 'tag'],
                        [/[a-zA-Z_][a-zA-Z0-9_]*/, 'identifier'],
                        [/[{}()\[\]]/, '@brackets'],
                        [/[<>:=&|+\-*/%~^!]=?/, 'operator'],
                        [/[;,.]/, 'delimiter']
                    ],
                    comment: [
                        [/[^*]+/, 'comment'],
                        [/\*\//, 'comment', '@pop'],
                        [/./, 'comment']
                    ],
                    string: [
                        [/[^\\"]+/, 'string'],
                        [/\\./, 'string.escape'],
                        [/"/, 'string', '@pop']
                    ]
                }
            });

            monaco.languages.setLanguageConfiguration('java', {
                comments: {
                    lineComment: '//',
                    blockComment: ['/*', '*/']
                },
                brackets: [
                    ['{', '}'],
                    ['[', ']'],
                    ['(', ')']
                ],
                autoClosingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"', close: '"' },
                    { open: '\'', close: '\'' }
                ],
                surroundingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"', close: '"' },
                    { open: '\'', close: '\'' }
                ],
                folding: {
                    markers: {
                        start: /^\s*\/\/\s*#region\b/,
                        end: /^\s*\/\/\s*#endregion\b/
                    }
                }
            });

            monaco.editor.defineTheme('islands-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '7A7E85', fontStyle: 'italic' },
                    { token: 'string', foreground: '6AAB73' },
                    { token: 'string.escape', foreground: '6AAB73', fontStyle: 'bold' },
                    { token: 'string.invalid', foreground: 'F75464' },
                    { token: 'number', foreground: '2AACB8' },
                    { token: 'number.hex', foreground: '2AACB8' },
                    { token: 'keyword', foreground: 'CF8E6D' },
                    { token: 'tag', foreground: 'B3AE60' },
                    { token: 'identifier', foreground: 'BCBEC4' },
                    { token: 'operator', foreground: 'BCBEC4' },
                    { token: 'delimiter', foreground: 'BCBEC4' },
                    { token: 'bracket', foreground: 'BCBEC4' }
                ],
                colors: {
                    'editor.background': '#191A1C',
                    'editor.foreground': '#BCBEC4',
                    'editorLineNumber.foreground': '#4B5059',
                    'editorLineNumber.activeForeground': '#A1A3AB',
                    'editorCursor.foreground': '#CED0D6',
                    'editor.selectionBackground': '#373B39',
                    'editor.inactiveSelectionBackground': '#373B3960',
                    'editor.lineHighlightBackground': '#1F2024',
                    'editor.lineHighlightBorder': '#00000000',
                    'editorGutter.background': '#191A1C',
                    'editorGutter.modifiedBackground': '#375FAD',
                    'editorGutter.addedBackground': '#549159',
                    'editorGutter.deletedBackground': '#FD5B87',
                    'editorIndentGuide.background1': '#323438',
                    'editorIndentGuide.activeBackground1': '#4E5157',
                    'editorWhitespace.foreground': '#6F737A',
                    'editorBracketMatch.border': '#F2C55C',
                    'editorBracketMatch.background': '#43454A',
                    'editorWidget.background': '#27282B',
                    'editorWidget.border': '#43454A',
                    'editorSuggestWidget.background': '#27282B',
                    'editorSuggestWidget.border': '#43454A',
                    'editorSuggestWidget.selectedBackground': '#2B2D30',
                    'editorSuggestWidget.foreground': '#BCBEC4',
                    'editorHoverWidget.background': '#27282B',
                    'editorHoverWidget.border': '#43454A',
                    'scrollbarSlider.background': '#FFFFFF26',
                    'scrollbarSlider.hoverBackground': '#FFFFFF4D',
                    'editorOverviewRuler.border': '#00000000',
                    'editor.findMatchBackground': '#2D543F',
                    'editor.findMatchHighlightBackground': '#11495755'
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                language: 'java',
                theme: 'islands-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                lineNumbers: 'on',
                fontSize: 14,
                fontFamily: '"JetBrains Mono", "Fira Code", "Consolas", "Monospace"',
                tabSize: 4,
                insertSpaces: true,
                scrollBeyondLastLine: false,
                renderLineHighlight: 'gutter',
                selectionHighlight: false,
                occurrencesHighlight: false,
                matchBrackets: 'near',
                autoIndent: 'full',
                formatOnPaste: false,
                formatOnType: false,
                wordBasedSuggestions: 'off',
                suggestOnTriggerCharacters: true,
                quickSuggestions: {
                    other: true,
                    comments: false,
                    strings: false
                },
                snippetSuggestions: 'inline',
                tabCompletion: 'on',
                parameterHints: { enabled: false },
                hover: { enabled: false },
                lightbulb: { enabled: false },
                codeLens: false,
                folding: true,
                renderIndentGuides: false,
                renderWhitespace: 'selection',
                cursorBlinking: 'blink',
                cursorSmoothCaretAnimation: 'off',
                smoothScrolling: false
            });

            let positions = {};
            let pendingFile = null;
            let pendingContent = null;

            function flushPending() {
                if (pendingFile != null && window.LarvIDE) {
                    let f = pendingFile, c = pendingContent;
                    pendingFile = null;
                    pendingContent = null;
                    clearTimeout(debounceTimer);
                    window.LarvIDE.onContentChange(f, c);
                }
            }

            // Listen for content changes
            editor.onDidChangeModelContent(function(e) {
                currentContent = editor.getValue();
                if (currentFile) {
                    pendingFile = currentFile;
                    pendingContent = currentContent;
                }
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function() {
                    flushPending();
                }, 300);
            });

            // Listen for cursor position changes
            editor.onDidChangeCursorPosition(function(e) {
                if (currentFile) {
                    positions[currentFile] = { lineNumber: e.position.lineNumber, column: e.position.column };
                }
                if (window.LarvIDE) {
                    window.LarvIDE.onCursorChange(e.position.lineNumber, e.position.column);
                }
            });

            // Register completion provider
            completionProvider = monaco.languages.registerCompletionItemProvider('java', {
                triggerCharacters: ['.', '(', '"', '\'', '@', '<', ' ', '\t'],
                provideCompletionItems: function(model, position) {
                    if (window.LarvIDE) {
                        return window.LarvIDE.requestCompletions(currentFile, position.lineNumber, position.column);
                    }
                    return { suggestions: [] };
                }
            });

            // Notify ready
            if (window.LarvIDE) {
                window.LarvIDE.onEditorReady();
            }
        });

        // JavaScript interface functions
        window.setContent = function(file, content) {
            flushPending();
            if (currentFile && currentFile !== file && editor) {
                positions[currentFile] = editor.getPosition();
            }
            currentFile = file;
            currentContent = content;
            pendingFile = null;
            pendingContent = null;
            if (editor) {
                editor.setValue(content);
                let p = positions[file];
                if (p) {
                    editor.setPosition({ lineNumber: p.lineNumber, column: p.column });
                    editor.revealLineInCenterIfOutsideViewport(p.lineNumber);
                }
            }
        };

        window.getContent = function() {
            return currentContent;
        };

        window.setTheme = function(theme) {
            if (editor) {
                monaco.editor.setTheme(theme);
            }
        };

        window.setFontSize = function(size) {
            if (editor) {
                editor.updateOptions({ fontSize: size });
            }
        };

        window.showDiagnostics = function(diagnostics) {
            if (editor) {
                const markers = diagnostics.map(function(d) {
                    return {
                        startLineNumber: d.line,
                        startColumn: d.column || 1,
                        endLineNumber: d.endLine || d.line,
                        endColumn: d.endColumn || 100,
                        message: d.message,
                        severity: d.severity === 'ERROR' ? monaco.MarkerSeverity.Error : 
                                 d.severity === 'WARNING' ? monaco.MarkerSeverity.Warning : 
                                 monaco.MarkerSeverity.Info
                    };
                });
                monaco.editor.setModelMarkers(editor.getModel(), 'java', markers);
            }
        };

        window.clearDiagnostics = function() {
            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'java', []);
            }
        };

        window.focus = function() {
            if (editor) {
                editor.focus();
            }
        };

        window.execAction = function(action) {
            if (!editor) return;
            try {
                switch (action) {
                    case 'undo': editor.trigger('', 'undo', null); break;
                    case 'redo': editor.trigger('', 'redo', null); break;
                    case 'find': editor.trigger('', 'actions.find', null); break;
                    case 'findNext': editor.trigger('', 'actions.find.next', null); break;
                    case 'findPrevious': editor.trigger('', 'actions.find.previous', null); break;
                    case 'selectAll': editor.trigger('', 'editor.action.selectAll', null); break;
                }
            } catch (e) {
                // ignore
            }
        };
    </script>
</body>
</html>
