<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('file:///android_asset/fonts/JetBrainsMono-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #191A1C;
            color: #BCBEC4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        #editor {
            height: 100%;
            width: 100%;
        }
        .monaco-editor {
            background: #191A1C !important;
        }
        .monaco-editor .margin {
            background: #191A1C !important;
        }
        .monaco-editor .lines-content {
            background: #191A1C !important;
        }
    </style>
</head>
<body>
    <div id="editor"></div>

    <!-- Monaco Editor AMD Loader -->
    <script src="editor/vs/loader.js"></script>
    <script>
        require.config({
            paths: {
                'vs': 'file:///android_asset/editor/vs'
            }
        });

        let editor = null;
        let currentFile = '';
        let currentContent = '';
        let debounceTimer = null;
        let completionProvider = null;

        // Initialize editor
        require(['vs/editor/editor.main'], function() {
            // Define Java language
            monaco.languages.register({ id: 'java' });
            monaco.languages.setMonarchTokensProvider('java', {
                tokenizer: {
                    root: [
                        [/\/\/.*$/, 'comment'],
                        [/\/\*/, 'comment', '@comment'],
                        [/"([^"\\]|\\.)*$/, 'string.invalid'],
                        [/"/, 'string', '@string'],
                        [/'[^\\']'/, 'string'],
                        [/(\\d+\.\d+|\d+)(f|F|d|D|l|L)?/, 'number'],
                        [/0x[0-9a-fA-F]+(l|L)?/, 'number.hex'],
                        [/\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|record|sealed|permits|yield|var|module|exports|opens|requires|uses|provides|with|non-sealed)\b/, 'keyword'],
                        [/\b(true|false|null)\b/, 'keyword'],
                        [/@[a-zA-Z_][a-zA-Z0-9_]*/, 'tag'],
                        [/[a-zA-Z_][a-zA-Z0-9_]*/, 'identifier'],
                        [/[{}()\[\]]/, '@brackets'],
                        [/[<>:=&|+\-*/%~^!]=?/, 'operator'],
                        [/[;,.]/, 'delimiter']
                    ],
                    comment: [
                        [/[^*]+/, 'comment'],
                        [/\*\//, 'comment', '@pop'],
                        [/./, 'comment']
                    ],
                    string: [
                        [/[^\\"]+/, 'string'],
                        [/\\./, 'string.escape'],
                        [/"/, 'string', '@pop']
                    ]
                }
            });

            monaco.languages.setLanguageConfiguration('java', {
                comments: {
                    lineComment: '//',
                    blockComment: ['/*', '*/']
                },
                brackets: [
                    ['{', '}'],
                    ['[', ']'],
                    ['(', ')']
                ],
                autoClosingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"', close: '"' },
                    { open: '\'', close: '\'' }
                ],
                surroundingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"', close: '"' },
                    { open: '\'', close: '\'' }
                ],
                folding: {
                    markers: {
                        start: /^\s*\/\/\s*#region\b/,
                        end: /^\s*\/\/\s*#endregion\b/
                    }
                }
            });

            monaco.editor.defineTheme('islands-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '7A7E85', fontStyle: 'italic' },
                    { token: 'string', foreground: '6AAB73' },
                    { token: 'string.escape', foreground: '6AAB73', fontStyle: 'bold' },
                    { token: 'string.invalid', foreground: 'F75464' },
                    { token: 'number', foreground: '2AACB8' },
                    { token: 'number.hex', foreground: '2AACB8' },
                    { token: 'keyword', foreground: 'CF8E6D' },
                    { token: 'tag', foreground: 'B3AE60' },
                    { token: 'identifier', foreground: 'BCBEC4' },
                    { token: 'operator', foreground: 'BCBEC4' },
                    { token: 'delimiter', foreground: 'BCBEC4' },
                    { token: 'bracket', foreground: 'BCBEC4' }
                ],
                colors: {
                    'editor.background': '#191A1C',
                    'editor.foreground': '#BCBEC4',
                    'editorLineNumber.foreground': '#4B5059',
                    'editorLineNumber.activeForeground': '#A1A3AB',
                    'editorCursor.foreground': '#CED0D6',
                    'editor.selectionBackground': '#373B39',
                    'editor.inactiveSelectionBackground': '#373B3960',
                    'editor.lineHighlightBackground': '#1F2024',
                    'editor.lineHighlightBorder': '#00000000',
                    'editorGutter.background': '#191A1C',
                    'editorGutter.modifiedBackground': '#375FAD',
                    'editorGutter.addedBackground': '#549159',
                    'editorGutter.deletedBackground': '#FD5B87',
                    'editorIndentGuide.background1': '#323438',
                    'editorIndentGuide.activeBackground1': '#4E5157',
                    'editorWhitespace.foreground': '#6F737A',
                    'editorBracketMatch.border': '#F2C55C',
                    'editorBracketMatch.background': '#43454A',
                    'editorWidget.background': '#27282B',
                    'editorWidget.border': '#43454A',
                    'editorSuggestWidget.background': '#27282B',
                    'editorSuggestWidget.border': '#43454A',
                    'editorSuggestWidget.selectedBackground': '#2B2D30',
                    'editorSuggestWidget.foreground': '#BCBEC4',
                    'editorHoverWidget.background': '#27282B',
                    'editorHoverWidget.border': '#43454A',
                    'scrollbarSlider.background': '#FFFFFF26',
                    'scrollbarSlider.hoverBackground': '#FFFFFF4D',
                    'editorOverviewRuler.border': '#00000000',
                    'editor.findMatchBackground': '#2D543F',
                    'editor.findMatchHighlightBackground': '#11495755'
                }
            });

            monaco.editor.defineTheme('vscode-dark-plus', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '6A9955' },
                    { token: 'string', foreground: 'CE9178' },
                    { token: 'number', foreground: 'B5CEA8' },
                    { token: 'keyword', foreground: '569CD6' },
                    { token: 'type', foreground: '4EC9B0' },
                    { token: 'type.identifier', foreground: '4EC9B0' },
                    { token: 'identifier', foreground: '9CDCFE' },
                    { token: 'function', foreground: 'DCDCAA' },
                    { token: 'delimiter', foreground: 'D4D4D4' }
                ],
                colors: {
                    'editor.background': '#1E1E1E',
                    'editor.foreground': '#D4D4D4',
                    'editorLineNumber.foreground': '#858585',
                    'editorCursor.foreground': '#AEAFAD',
                    'editor.selectionBackground': '#264F78',
                    'editor.lineHighlightBackground': '#282828'
                }
            });

            monaco.editor.defineTheme('monokai', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '75715E' },
                    { token: 'string', foreground: 'E6DB74' },
                    { token: 'number', foreground: 'AE81FF' },
                    { token: 'keyword', foreground: 'F92672' },
                    { token: 'type', foreground: '66D9EF', fontStyle: 'italic' },
                    { token: 'type.identifier', foreground: '66D9EF' },
                    { token: 'function', foreground: 'A6E22E' },
                    { token: 'identifier', foreground: 'F8F8F2' }
                ],
                colors: {
                    'editor.background': '#272822',
                    'editor.foreground': '#F8F8F2',
                    'editorLineNumber.foreground': '#90908A',
                    'editorCursor.foreground': '#F8F8F0',
                    'editor.selectionBackground': '#49483E',
                    'editor.lineHighlightBackground': '#2F302A'
                }
            });

            monaco.editor.defineTheme('larv-light', {
                base: 'vs',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '6E7781' },
                    { token: 'string', foreground: '0A3069' },
                    { token: 'number', foreground: '0550AE' },
                    { token: 'keyword', foreground: 'CF222E' },
                    { token: 'type', foreground: '953800' },
                    { token: 'type.identifier', foreground: '953800' },
                    { token: 'function', foreground: '8250DF' },
                    { token: 'identifier', foreground: '1F2328' }
                ],
                colors: {
                    'editor.background': '#FFFFFF',
                    'editor.foreground': '#1F2328',
                    'editorLineNumber.foreground': '#8C959F',
                    'editorCursor.foreground': '#24292F',
                    'editor.selectionBackground': '#ADD6FF',
                    'editor.lineHighlightBackground': '#F6F8FA'
                }
            });

            monaco.editor.defineTheme('solarized-light', {
                base: 'vs',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '93A1A1', fontStyle: 'italic' },
                    { token: 'string', foreground: '2AA198' },
                    { token: 'number', foreground: 'D33682' },
                    { token: 'keyword', foreground: '859900' },
                    { token: 'type', foreground: 'B58900' },
                    { token: 'type.identifier', foreground: 'B58900' },
                    { token: 'function', foreground: '268BD2' },
                    { token: 'identifier', foreground: '586E75' }
                ],
                colors: {
                    'editor.background': '#FDF6E3',
                    'editor.foreground': '#586E75',
                    'editorLineNumber.foreground': '#93A1A1',
                    'editorCursor.foreground': '#657B83',
                    'editor.selectionBackground': '#EEE8D5',
                    'editor.lineHighlightBackground': '#EEE8D5'
                }
            });

            const FONT_STACKS = {
                jetbrains: '"JetBrains Mono", "Fira Code", Consolas, monospace',
                fira: '"Fira Code", Consolas, monospace',
                roboto: '"Roboto Mono", Menlo, Consolas, monospace',
                mono: 'Menlo, Consolas, "Courier New", monospace',
                system: 'Roboto, system-ui, sans-serif'
            };

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                language: 'java',
                theme: 'islands-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                lineNumbers: 'on',
                fontSize: 14,
                fontFamily: '"JetBrains Mono", "Fira Code", "Consolas", "Monospace"',
                tabSize: 4,
                insertSpaces: true,
                scrollBeyondLastLine: false,
                renderLineHighlight: 'gutter',
                selectionHighlight: false,
                occurrencesHighlight: false,
                matchBrackets: 'near',
                autoIndent: 'full',
                formatOnPaste: false,
                formatOnType: false,
                wordBasedSuggestions: 'currentDocument',
                suggestOnTriggerCharacters: true,
                quickSuggestions: {
                    other: true,
                    comments: false,
                    strings: false
                },
                snippetSuggestions: 'inline',
                tabCompletion: 'on',
                parameterHints: { enabled: false },
                hover: { enabled: false },
                lightbulb: { enabled: true },
                codeLens: false,
                folding: true,
                renderIndentGuides: false,
                renderWhitespace: 'selection',
                cursorBlinking: 'blink',
                cursorSmoothCaretAnimation: 'off',
                smoothScrolling: false
            });

            let positions = {};
            let pendingFile = null;
            let pendingContent = null;

            function flushPending() {
                if (pendingFile != null && window.LarvIDE) {
                    let f = pendingFile, c = pendingContent;
                    pendingFile = null;
                    pendingContent = null;
                    clearTimeout(debounceTimer);
                    window.LarvIDE.onContentChange(f, c);
                }
            }

            // Listen for content changes
            editor.onDidChangeModelContent(function(e) {
                currentContent = editor.getValue();
                if (currentFile) {
                    pendingFile = currentFile;
                    pendingContent = currentContent;
                }
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function() {
                    flushPending();
                }, 300);
            });

            // Listen for cursor position changes
            editor.onDidChangeCursorPosition(function(e) {
                if (currentFile) {
                    positions[currentFile] = { lineNumber: e.position.lineNumber, column: e.position.column };
                }
                if (window.LarvIDE) {
                    window.LarvIDE.onCursorChange(e.position.lineNumber, e.position.column);
                }
            });

            // Register completion provider (async via LarvIDE bridge)
            let completionSeq = 0;
            let pendingCompletions = new Map();

            function monacoKindFor(kind) {
                const K = monaco.languages.CompletionItemKind;
                switch (kind) {
                    case 'CLASS': return K.Class;
                    case 'INTERFACE': return K.Interface;
                    case 'ENUM': return K.Enum;
                    case 'RECORD': return K.Struct;
                    case 'ANNOTATION': return K.Property;
                    case 'METHOD': return K.Method;
                    case 'FIELD': return K.Field;
                    case 'PARAMETER': return K.Variable;
                    case 'LOCAL_VARIABLE': return K.Variable;
                    case 'PACKAGE': return K.Module;
                    case 'KEYWORD': return K.Keyword;
                    case 'SNIPPET': return K.Snippet;
                    default: return K.Text;
                }
            }

            function toMonacoSuggestions(items, range) {
                return (items || []).map(function(item) {
                    let sortText = String(item.sortPriority || 9999).padStart(5, '0') + (item.label || '');
                    return {
                        label: item.label,
                        kind: monacoKindFor(item.kind),
                        detail: item.detail || '',
                        documentation: item.documentation || '',
                        insertText: item.insertText || item.label,
                        insertTextRules: item.insertText && item.insertText.indexOf('$') >= 0
                            ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet : undefined,
                        filterText: item.filterText || item.label,
                        sortText: sortText,
                        range: range
                    };
                });
            }

            const larvCompletionProvider = {                triggerCharacters: ['.', '@'],
                provideCompletionItems: function(model, position) {
                    if (!window.LarvIDE) {
                        return { suggestions: [] };
                    }
                    return new Promise(function(resolve) {
                        const id = ++completionSeq;
                        const word = model.getWordUntilPosition(position);
                        const range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber: position.lineNumber,
                            startColumn: word.startColumn,
                            endColumn: word.endColumn
                        };
                        const upto = model.getValueInRange({
                            startLineNumber: position.lineNumber, startColumn: 1,
                            endLineNumber: position.lineNumber, endColumn: position.column
                        });
                        let memberOf = '';
                        let prefix = word.word;
                        const dotMatch = /\.(\w*)$/.exec(upto);
                        if (dotMatch) {
                            prefix = dotMatch[1];
                            const beforeDot = upto.slice(0, upto.length - dotMatch[0].length);
                            const recvMatch = /([\w$]+(?:\.[\w$]+)*)\s*$/.exec(beforeDot);
                            memberOf = recvMatch ? recvMatch[1] : '';
                        }
                        pendingCompletions.set(id, function(items) {
                            resolve({ suggestions: toMonacoSuggestions(items, range) });
                        });
                        setTimeout(function() {
                            if (pendingCompletions.has(id)) {
                                pendingCompletions.delete(id);
                                resolve({ suggestions: [] });
                            }
                        }, 1500);
                        window.LarvIDE.requestCompletions(currentFile, position.lineNumber,
                            position.column, id, prefix, memberOf);
                    });
                }
            };

            ['java', 'python', 'javascript'].forEach(function(lang) {
                completionProvider = monaco.languages.registerCompletionItemProvider(lang, larvCompletionProvider);
            });

            window.__larvDeliverCompletions = function(id, items) {
                const cb = pendingCompletions.get(id);
                if (cb) {
                    pendingCompletions.delete(id);
                    cb(items);
                }
            };

            function computeImportInsertLine(model) {
                const n = Math.min(model.getLineCount(), 400);
                let lastImport = 0;
                let packageLine = 0;
                for (let i = 1; i <= n; i++) {
                    const t = model.getLineContent(i);
                    if (/^import\s/.test(t)) lastImport = i;
                    else if (/^package\s/.test(t)) packageLine = i;
                }
                return (lastImport || packageLine || 0) + 1;
            }

            monaco.languages.registerCodeActionProvider('java', {
                provideCodeActions: function(model, range, context) {
                    const actions = [];
                    const markers = context.markers || [];
                    for (let i = 0; i < markers.length; i++) {
                        const marker = markers[i];
                        const cm = /^(\w+) cannot be resolved to a type/.exec(marker.message);
                        if (!cm) continue;
                        let candidates = [];
                        try {
                            candidates = JSON.parse(window.LarvIDE.importCandidates(cm[1]) || '[]');
                        } catch (e) {}
                        const line = computeImportInsertLine(model);
                        for (let c = 0; c < candidates.length && c < 5; c++) {
                            actions.push({
                                title: "Import '" + candidates[c] + "'",
                                kind: 'quickfix',
                                isPreferred: c === 0,
                                diagnostics: [marker],
                                edit: {
                                    edits: [{
                                        range: {
                                            startLineNumber: line, startColumn: 1,
                                            endLineNumber: line, endColumn: 1
                                        },
                                        text: 'import ' + candidates[c] + ';\n'
                                    }]
                                }
                            });
                        }
                    }
                    return { actions: actions, dispose: function() {} };
                }
            });

            // Notify ready
            if (window.LarvIDE) {
                window.LarvIDE.onEditorReady();
            }
        });

        // JavaScript interface functions
        function languageForFile(file) {
            const ext = (file || '').split('.').pop().toLowerCase();
            switch (ext) {
                case 'java': return 'java';
                case 'py': return 'python';
                case 'js': return 'javascript';
                case 'html': case 'htm': return 'html';
                case 'css': return 'css';
                case 'json': return 'json';
                case 'xml': return 'xml';
                case 'md': return 'markdown';
                default: return 'plaintext';
            }
        }

        window.setContent = function(file, content) {
            flushPending();
            if (currentFile && currentFile !== file && editor) {
                positions[currentFile] = editor.getPosition();
            }
            currentFile = file;
            currentContent = content;
            pendingFile = null;
            pendingContent = null;
            if (editor) {
                editor.setValue(content);
                let p = positions[file];
                if (p) {
                    editor.setPosition({ lineNumber: p.lineNumber, column: p.column });
                    editor.revealLineInCenterIfOutsideViewport(p.lineNumber);
                }
                monaco.editor.setModelLanguage(editor.getModel(), languageForFile(file));
            }
        };

        window.getContent = function() {
            return currentContent;
        };

        window.setTheme = function(theme) {
            if (editor) {
                monaco.editor.setTheme(theme);
            }
        };

        window.setFontSize = function(size) {
            if (editor) {
                editor.updateOptions({ fontSize: size });
            }
        };

        window.applyEditorSettings = function(settings) {
            if (!editor) return;
            editor.updateOptions({
                fontSize: settings.fontSize || 14,
                tabSize: settings.tabSize || 4,
                lineNumbers: settings.lineNumbers === false ? 'off' : 'on',
                wordWrap: settings.wordWrap ? 'on' : 'off',
                minimap: { enabled: !!settings.minimap },
                renderIndentGuides: settings.indentGuides !== false,
                renderLineHighlight: settings.highlightLine === false ? 'none' : 'gutter',
                fontFamily: FONT_STACKS[settings.fontFamily] || FONT_STACKS.jetbrains
            });
        };

        window.setEditorTheme = function(themeId) {
            if (editor && themeId) {
                monaco.editor.setTheme(themeId);
            }
        };

        window.setCursorPositions = function(positionsJson) {
            try {
                const saved = typeof positionsJson === 'string' ? JSON.parse(positionsJson) : positionsJson;
                for (const k in saved) {
                    positions[k] = { lineNumber: saved[k].lineNumber, column: saved[k].column };
                }
            } catch (e) {}
        };

        window.showDiagnostics = function(diagnostics) {
            if (editor) {
                const markers = diagnostics.map(function(d) {
                    return {
                        startLineNumber: d.line,
                        startColumn: d.column || 1,
                        endLineNumber: d.endLine || d.line,
                        endColumn: d.endColumn || 100,
                        message: d.message,
                        severity: d.severity === 'ERROR' ? monaco.MarkerSeverity.Error : 
                                 d.severity === 'WARNING' ? monaco.MarkerSeverity.Warning : 
                                 monaco.MarkerSeverity.Info
                    };
                });
                monaco.editor.setModelMarkers(editor.getModel(), 'java', markers);
            }
        };

        window.clearDiagnostics = function() {
            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'java', []);
            }
        };

        window.focus = function() {
            if (editor) {
                editor.focus();
            }
        };

        window.execAction = function(action) {
            if (!editor) return;
            try {
                switch (action) {
                    case 'undo': editor.trigger('', 'undo', null); break;
                    case 'redo': editor.trigger('', 'redo', null); break;
                    case 'find': editor.trigger('', 'actions.find', null); break;
                    case 'findNext': editor.trigger('', 'actions.find.next', null); break;
                    case 'findPrevious': editor.trigger('', 'actions.find.previous', null); break;
                    case 'selectAll': editor.trigger('', 'editor.action.selectAll', null); break;
                }
            } catch (e) {
                // ignore
            }
        };
    </script>
</body>
</html>
