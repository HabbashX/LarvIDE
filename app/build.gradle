plugins {
    id 'com.android.application'
}

android {
    namespace 'com.larv.ide'
    compileSdk 34

    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.larv.ide"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "LarvIDE-v${variant.versionName}.apk"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += "META-INF/*"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

// NOTE: the on-device ECJ compiler was removed (prefix javac resolves java.*
// from the OpenJDK in the embedded runtime), so no bootclasspath is bundled.
tasks.named('preBuild') {
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Installs the baseline profile at first run so ART AOT-compiles the
    // startup/editor hot paths without waiting for a cloud profile.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    
    // WebView for Monaco Editor
    implementation 'androidx.webkit:webkit:1.8.0'
    
    // Coroutines for async
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.tukaani:xz:1.9'

    // No on-device dexer: Java compiles and runs inside the Linux prefix
    // (javac + JRE), exactly like Python, Node and Clang. R8/D8 removed.

    // Real terminal emulator (jackpal emulatorview).
    // Pure-Java VT100 emulator: TermSession accepts custom in/out streams,
    // so no subprocess/PTY is required for in-process program execution.
    implementation 'com.github.jackpal.Android-Terminal-Emulator:emulatorview:v1.0.70'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}