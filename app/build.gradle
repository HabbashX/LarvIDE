plugins {
    id 'com.android.application'
}

android {
    namespace 'com.larv.ide'
    compileSdk 34

    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.larv.ide"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "LarvIDE-v${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += "META-INF/*"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

// Bundle android.jar so the on-device ECJ compiler can resolve java.* types
tasks.register('copyBootclasspath') {
    def sdkDir = android.sdkDirectory
    def platform = new File(sdkDir, "platforms/android-34/android.jar")
    def outFile = file("$buildDir/generated/assets/bootclasspath/android.jar")
    inputs.file(platform)
    outputs.file(outFile)
    doLast {
        outFile.parentFile.mkdirs()
        copy {
            from platform
            into outFile.parentFile
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'copyBootclasspath'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // WebView for Monaco Editor
    implementation 'androidx.webkit:webkit:1.8.0'
    
    // Coroutines for async
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // ECJ - Eclipse Compiler for Java.
    // 3.26.0 is the last version that runs on a Java 8 runtime / Android < API 33:
    // Util.getInputStreamAsByteArray still uses a manual read loop. ECJ 3.27+
    // switched to InputStream.readAllBytes() (missing on Android below API 33),
    // and 3.28+ additionally requires a Java 11 runtime.
    implementation 'org.eclipse.jdt:ecj:3.26.0'
    
    // R8/D8 so the on-device dex step can produce real classes.dex
    implementation 'com.android.tools:r8:8.6.27'
    
    // D8/R8 is included in Android Gradle Plugin
    
    // Commons IO
    implementation 'commons-io:commons-io:2.15.1'
    
    // Real terminal emulator (jackpal emulatorview).
    // Pure-Java VT100 emulator: TermSession accepts custom in/out streams,
    // so no subprocess/PTY is required for in-process program execution.
    implementation 'com.github.jackpal.Android-Terminal-Emulator:emulatorview:v1.0.70'
}